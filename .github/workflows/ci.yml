name: CI

# Runs the same `make` targets a developer runs locally, deliberately: a check
# that only exists in CI drifts from the one people actually use.
"on":
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      # First and dependency-free: the generator reads backend/uv.lock and
      # frontend/package-lock.json directly (no venv, no node_modules), so a
      # stale dependencies.txt names itself in seconds. This is the drift that
      # survived two work packages before it was enforced.
      - name: dependencies.txt is current
        run: make deps-check

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Sync backend
        run: cd backend && uv sync --frozen

      - name: Install frontend
        run: cd frontend && npm ci

      - name: Lint
        run: make lint

      # No corpus and no API key: data/ is gitignored and every engine test
      # injects a fake transport, so the suite is fully offline. The five
      # PDF-parsing tests skip with an actionable message rather than passing
      # silently — that is expected here, not a gap.
      - name: Backend tests
        run: cd backend && uv run pytest -q -rs

      # `next typegen` first, and not as a nicety. next-env.d.ts references
      # .next/types/routes.d.ts and root-params.d.ts, which Next generates —
      # app/layout.tsx uses the generated `LayoutProps<"/">`. So a bare
      # `tsc --noEmit` on a clean checkout fails with
      # "Cannot find name 'LayoutProps'", and passes locally only because a
      # previous build left the types behind. That is exactly the CI-only
      # failure this workflow existed to catch, on its first run.
      - name: Frontend typecheck
        run: cd frontend && npx next typegen && npx tsc --noEmit

      - name: Frontend build
        run: cd frontend && npm run build
